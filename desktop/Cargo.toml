[package]
name = "infalsus_desktop"
version = "0.1.0"
edition = "2021"
description = "In Falsus 製卡最佳化的桌面版：Rust 原生視窗（系統內建的 WebView2）＋原生多執行緒求解器，單一 exe，不需要 Node／瀏覽器／本機伺服器"
publish = false

[[bin]]
name = "InFalsusSolver"
path = "src/main.rs"

[dependencies]
infalsus_solver = { path = "../wasm" }
wry = "0.57"
tao = "0.37"
base64 = "0.22"
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
